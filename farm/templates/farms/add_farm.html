{% extends "app_base.html" %}
{% block title %}Add a farm - Miginon Farm{% endblock %}
{% block app_content %}
<div class="mx-auto max-w-lg rounded-2xl border border-stone-200 bg-white p-8">
    <h1 class="text-xl font-extrabold text-stone-900">Add another farm</h1>
    <p class="mt-1 text-sm text-stone-500">You'll get a new unique Farm ID and become its owner.</p>
    <form method="post" class="mt-6" novalidate>
        {% csrf_token %}
        {% include "partials/form_fields.html" %}
        <button type="submit" class="w-full rounded-xl bg-emerald-700 px-4 py-3 text-sm font-bold text-white hover:bg-emerald-800">
            Create farm →
        </button>
    </form>
</div>
{% endblock %}
